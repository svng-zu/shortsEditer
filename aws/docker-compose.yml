version: '3.8'
services:
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    ports:
      - "4416:4416"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=shortsai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shortsai}
      - POSTGRES_DB=shortsai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortsai -d shortsai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_SANDBOX_SECURITY: unconfined
    security_opt:
      - apparmor:unconfined
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-ko}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-}
      - BGUTIL_URL=http://bgutil:4416
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://shortsai:${POSTGRES_PASSWORD:-shortsai}@postgres:5432/shortsai}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - GOOGLE_AUTH_CLIENT_ID=${GOOGLE_AUTH_CLIENT_ID:-}
      - GOOGLE_AUTH_CLIENT_SECRET=${GOOGLE_AUTH_CLIENT_SECRET:-}
      - GOOGLE_AUTH_REDIRECT_URI=${GOOGLE_AUTH_REDIRECT_URI:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://gorilai.duckdns.org}
      - SES_SENDER_EMAIL=${SES_SENDER_EMAIL:-}
    volumes:
      - ./data:/app/data
      - ./static:/app/static
      - faster_whisper_cache:/root/.cache/huggingface
      - /home/ubuntu/.cache/yt-dlp:/root/.cache/yt-dlp
    depends_on:
      bgutil:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    security_opt:
      - apparmor:unconfined
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - bgutil
    restart: unless-stopped

volumes:
  faster_whisper_cache:
  postgres_data:
