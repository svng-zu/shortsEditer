version: '3.8'
services:
  bgutil:
    ports:
      - "4417:4416"

  postgres:
    environment:
      - POSTGRES_DB=shortsai_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortsai -d shortsai_dev"]

  backend:
    ports:
      - "8001:8000"
    environment:
      - S3_KEY_PREFIX=dev/
      - DATABASE_URL=postgresql+psycopg2://shortsai:${POSTGRES_PASSWORD:-shortsai}@postgres:5432/shortsai_dev
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:8080"]
      - FRONTEND_URL=http://localhost:8080
    volumes:
      - ./data-dev:/app/data
      - ./static:/app/static
      - faster_whisper_cache:/root/.cache/huggingface
      - /home/ubuntu/.cache/yt-dlp:/root/.cache/yt-dlp

  frontend:
    ports:
      - "8080:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data_dev:
  faster_whisper_cache:
